<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동남아 여행</title>
<style>
body { font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", Arial, "Apple SD Gothic Neo", sans-serif; margin: 0; background: #fff; color: #111827; }
.page { max-width: 1080px; margin: 24px auto; padding: 16px; }
.menu { display: flex; gap: 16px; padding: 16px 8px 24px; justify-content: center; }
.tab { cursor: pointer; font-size: 18px; }
.tab.active { filter: brightness(0.95); }
.content { min-height: 420px; margin: 0 24px 24px; display: grid; place-items: center; padding: 0; }
.content-inner { width: 100%; max-width: 900px; }
.hero { width: 100%; height: 260px; object-fit: cover; }
.video { width: 100%; aspect-ratio: 16 / 9; }
.title { text-align: center; margin: 12px 0 16px; font-size: 22px; }
@media (max-width: 640px) {
  .menu { gap: 12px; flex-wrap: wrap; }
  .tab { font-size: 16px; }
  .content { margin: 0 12px 12px; }
}
</style>
<!-- Materialize (Material Design) CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <main class="page">
    <nav class="menu" aria-label="주요 국가 선택">
      <a class="waves-effect waves-light btn-large tab active" data-country="th"><i class="material-icons left">place</i>태국</a>
      <a class="waves-effect waves-light btn-large tab" data-country="ph"><i class="material-icons left">beach_access</i>필리핀</a>
      <a class="waves-effect waves-light btn-large tab" data-country="vn"><i class="material-icons left">terrain</i>베트남</a>
    </nav>

    <section class="content" id="content" aria-live="polite"></section>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script>
  const contentEl = document.getElementById('content');
  const tabs = Array.from(document.querySelectorAll('.tab'));

  const templates = {
    th: {
      title: '태국 여행이란',
      img: 'https://images.unsplash.com/photo-1506973035872-a4ec16b8e8d2?q=80&w=1600&auto=format&fit=crop',
      video: 'https://www.youtube.com/embed/CZr1wG2iOrA'
    },
    ph: {
      title: '필리핀 여행이란',
      img: 'https://images.unsplash.com/photo-1518544801976-3e89f06f7d15?q=80&w=1600&auto=format&fit=crop',
      video: 'https://www.youtube.com/embed/0h1VYfZ2LwA'
    },
    vn: {
      title: '베트남 여행이란',
      img: 'https://images.unsplash.com/photo-1512453979798-5ea266f8880c?q=80&w=1600&auto=format&fit=crop',
      video: 'https://www.youtube.com/embed/2z0Gx5Z7tTM'
    }
  };

  function render(countryKey) {
    const { title, img, video } = templates[countryKey];
    contentEl.innerHTML = `
      <div class="content-inner">
        <div class="card">
          <div class="card-image">
            <img class="hero" src="${img}" alt="${title} 이미지" />
            <span class="card-title">${title}</span>
          </div>
          <div class="card-content">
            <p>아래 영상으로 ${title} 분위기를 느껴보세요.</p>
          </div>
          <div class="card-action">
            <div class="video-container">
              <iframe class="video" src="${video}" title="${title} 유튜브 영상" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      render(tab.dataset.country);
    });
  });

  // 초기 로드: 태국
  render('th');
  </script>
</body>
</html>
