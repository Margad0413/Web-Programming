<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Planner - 게임 추천</title>
    <link rel="stylesheet" href="style.css">
    <script src="igdb_api.js"></script>
    <script src="main.js"></script>
</head>
<body>
    <header>
        <div class="logo">G-Planner</div>
        <nav>
            <ul>
                <li><a href="index.html">메인</a></li>
                <li><a href="recommend.html" class="active">게임 추천★</a></li>
                <li><a href="schedule_form.html">일정 등록</a></li>
            </ul>
        </nav>
        <div class="theme-toggle">
            <button id="darkModeBtn">🌙 다크모드</button>
        </div>
    </header>

    <main class="container recommend-layout">
        <section class="search-section">
            <form class="search-form" id="searchForm">
                <input type="search" id="searchInput" placeholder="게임 타이틀이나 키워드를 입력하세요...">
                <button type="submit">검색</button>
            </form>
            
            <div class="search-results" id="searchResults"></div>
        </section>

        <section class="slot-section">
            <h3>🎰 내 라이브러리 기반 맞춤 추천 슬롯</h3>
            
            <div class="slot-machine" id="slotMachineContainer"></div>
            
            <div class="roll-action">
                <button class="roll-btn" id="rollBtn">🎲 다른 게임 추천 받기 (ROLL)</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 G-Planner. 컴퓨터공학과 기말 프로젝트</p>
    </footer>
</body>
</html>
