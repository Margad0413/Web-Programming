<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Planner - 플레이 일정 등록</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>
    <script>applyThemeImmediately();</script>
</head>
<body>
    <header>
        <div class="logo">G-Planner</div>
        <nav>
            <ul>
                <li><a href="index.html">메인</a></li>
                <li><a href="recommend.html">게임 추천</a></li>
                <li><a href="schedule_form.html" class="active">일정 등록★</a></li>
            </ul>
        </nav>
        <div class="theme-toggle">
            <button id="darkModeBtn">🌙 다크모드 토글</button>
        </div>
    </header>

    <main class="container form-layout">
        <section class="form-section">
            <h2>새로운 플레이 일정 등록</h2>
            
            <form class="schedule-web-form" onsubmit="return false;">
                <div class="form-group">
                    <label for="gameSelect">선택된 게임:</label>
                    <select id="gameSelect">
                        <option value="stardew">스타듀밸리</option>
                        <option value="witcher">위쳐 3</option>
                        <option value="rimworld">림월드</option>
                    </select>
                </div>

                <div class="form-group inline-group">
                    <label>목표 플레이 기간:</label>
                    <div class="date-inputs">
                        <input type="date" value="2026-05-28">
                        <span>~</span>
                        <input type="date" value="2026-06-28">
                    </div>
                </div>

                <div class="form-group">
                    <label for="targetTime">목표 플레이 타임:</label>
                    <div class="time-input-wrapper">
                        <input type="number" id="targetTime" value="40" min="1">
                        <span>시간</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="memo">메모:</label>
                    <textarea id="memo" rows="5" placeholder="플레이 계획이나 메모를 입력하세요.">엔딩 볼 때까지 하루에 1시간씩 꼭하기!</textarea>
                </div>

                <div class="form-action">
                    <button type="submit" class="submit-btn">캘린더에 등록</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 G-Planner. 컴퓨터공학과 기말 프로젝트</p>
    </footer>
</body>
</html>
